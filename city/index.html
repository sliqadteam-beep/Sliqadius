,z:b.z+nz*o},.03,lm,.125);if(y)g.add(y)}}}}function roadsBuild(){rg.clear();for(let r of roads)draw(r);details()}function details(){dg.clear();for(let r of roads)for(let i=0;i<r.p.length-1;i++){let a=r.p[i],b=r.p[i+1],n=Math.floor(Math.hypot(b.x-a.x,b.z-a.z)/6);for(let j=1;j<n;j++){let t=j/n,x=a.x+(b.x-a.x)*t,z=a.z+(b.z-a.z)*t,p=new T.Mesh(new T.CylinderGeometry(.035,.045,1.7,7),new T.MeshStandardMaterial({color:0x3d474b}));p.position.set(x,.85,z+RT[r.t].w*.75);dg.add(p)}}}function house(b){let g=new T.Group(),m=new T.MeshStandardMaterial({color:b.k==='res'?0xd8c6b3:b.k==='com'?0xb9c7cb:b.k==='ind'?0x8f918d:b.k==='park'?0x5f9b50:0x75818a,roughness:.75}),h=b.k==='com'?4:b.k==='ind'?2:2.8,w=b.k==='ind'?3:2,d=2;if(b.k==='park')g.add(B(3,.05,3,m,0,.025,0));else{g.add(B(w,h,d,m,0,h/2,0));if(b.k!=='ind')for(let y=.6;y<h-.2;y+=.55)g.add(B(w*.65,.16,.03,gl,0,y,d/2+.02))}g.position.set(b.x,0,b.z);return g}function buildingsBuild(){bg.clear();for(let b of buildings)bg.add(house(b))}function toast(t){let e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e.t);e.t=setTimeout(()=>e.style.opacity=0,1300)}function demolish(p,w){buildings=buildings.filter(b=>{for(let i=0;i<p.length-1;i++)if(seg(b,p[i],p[i+1]).d<w*.55+1.4)return false;return true});buildingsBuild()}function addRoad(p,t){let s=RT[t],l=0;for(let i=0;i<p.length-1;i++)l+=Math.hypot(p[i+1].x-p[i].x,p[i+1].z-p[i].z);let c=Math.ceil(l*s.c/2.2);if(st.money<c)return toast('Not enough money');demolish(p,s.w);st.money-=c;roads.push({t,p});roadsBuild();saveGame();toast('Road built')}function round(p,t){let s=RT[t],a=[];for(let i=0;i<=36;i++){let q=i/36*Math.PI*2;a.push({x:p.x+Math.cos(q)*s.r,z:p.z+Math.sin(q)*s.r})}addRoad(a,t);for(let q of[0,1.57,3.14,4.71])addRoad([{x:p.x+Math.cos(q)*s.r,z:p.z+Math.sin(q)*s.r},{x:p.x+Math.cos(q)*(s.r+4),z:p.z+Math.sin(q)*(s.r+4)}],'one')}function place(p,k,c=0){let n=near(p);if(!n)return toast('Must be placed next to a road');if(st.money<c)return toast('Not enough money');let dx=n.b. ain.value=on?+$('mv').value/100:0;music.gain.value=+$('mus').value/100;city.gain.value=+$('cv').value/100}$('snd').onclick=()=>{audio();on=!on;$('snd').textContent='Sound: '+(on?'On':'Off');vol()};for(let id of['mv','mus','cv'])$(id).oninput=()=>{let v={mv:'mvv',mus:'musv',cv:'cvv'};$(v[id]).textContent=$(id).value+'%';vol()};$('play').onclick=()=>{$('menu').style.display='none';st.paused=false};$('set').onclick=()=>$('settings').style.display='flex';$('back').onclick=()=>$('settings').style.display='none';$('q').onclick=()=>{$('menu').style.display='none';$('quit').style.display='flex'};$('menub').onclick=()=>{st.paused=true;$('menu').style.display='flex'};$('save').onclick=()=>{saveGame();toast('Saved')};$('pause').onclick=()=>{st.paused=!st.paused;$('pause').textContent=st.paused?'>':'II'};$('speed').onclick=()=>{st.speed=st.speed===1?2:st.speed===2?4:1;$('speed').textContent=st.speed+'x'};let pt=performance.now();function loop(t){requestAnimationFrame(loop);let dt=Math.min(.05,(t-pt)/1000);pt=t;if(!st.paused){carsUp(dt);let r=buildings.filter(b=>b.k==='res').length,c=buildings.filter(b=>b.k==='com').length,i=buildings.filter(b=>b.k==='ind').length;st.pop+=(Math.min(r*28,(c*18+i*24)*1.7+30)-st.pop)*dt*.18;st.money+=(st.pop*.05+c*2+i*2)*dt*st.speed;st.happy=C(72-cars.length*.08,35,96)}cam.position.set(target.x+Math.cos(az)*Math.cos(el)*dist,Math.sin(el)*dist,target.z+Math.sin(az)*Math.cos(el)*dist);cam.lookAt(target);R.render(S,cam);$('money').textContent=Math.round(st.money).toLocaleString();$('pop').textContent=Math.round(st.pop).toLocaleString();$('happy').textContent=Math.round(st.happy)+'%';$('traffic').textContent=cars.length>30?'Heavy':cars.length>14?'Moderate':'Light'}loop(pt);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});setTimeout(()=>{$('load').style.display='none';$('menu').style.display='flex'},500);</script></body></html>
