<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sliqado City 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bb8c8;color:#eef7fb;font:12px system-ui}canvas{display:block}.p{background:#10202bea;border:1px solid #ffffff22;backdrop-filter:blur(10px);box-shadow:0 8px 25px #0005}.top{position:fixed;z-index:9;top:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:10px}.brand{color:#70ef9e;font-weight:900}.side{position:fixed;z-index:9;right:8px;top:8px;width:210px;padding:10px;border-radius:13px}.r{display:flex;justify-content:space-between;margin:5px 0;color:#9fb4bf}.r b{color:#fff}.cats{position:fixed;z-index:10;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:6px;border-radius:13px;max-width:96vw;overflow:auto}.btn{border:0;border-radius:9px;background:#263b47;color:#fff;padding:8px 10px;font-weight:800;white-space:nowrap}.btn.on{background:#45e48a;color:#07160d}.tools{position:fixed;z-index:10;bottom:62px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:6px;border-radius:12px;max-width:96vw;overflow:auto}.tool{border:0;border-radius:8px;background:#2b414e;color:#fff;padding:8px 10px;font-size:11px;white-space:nowrap}.tool.on{background:#61baff;color:#07131b}.hint{position:fixed;z-index:8;left:8px;top:52px;padding:8px;border-radius:9px}.toast{position:fixed;z-index:20;top:58px;left:50%;transform:translateX(-50%);background:#101d25ee;padding:8px 12px;border-radius:9px;opacity:0;transition:.2s}@media(max-width:750px){.side{width:170px;top:88px}.top{right:180px}.hint{display:none}}
</style></head><body><div class="top"><div class="p pill brand">SLIQADO CITY 3D</div><div class="p pill">💰 <b id="money">100.000</b></div><div class="p pill">👥 <b id="pop">0</b></div><div class="p pill">😊 <b id="happy">70%</b></div><button class="btn" id="pause">⏸</button><button class="btn" id="speed">1×</button><button class="btn" id="save">💾</button></div><div class="p hint">Links ziehen: bauen/zonen · Rechts ziehen: Kamera · Mausrad: Zoom</div><aside class="p side"><b>Stadt</b><div class="r"><span>Wohnen</span><b id="dr">70%</b></div><div class="r"><span>Einkauf</span><b id="dc">50%</b></div><div class="r"><span>Industrie</span><b id="di">55%</b></div><div class="r"><span>Autos</span><b id="carsN">0</b></div><div class="r"><span>NPCs</span><b id="npcsN">0</b></div><div class="r"><span>Parken</span><b id="parkN">0/0</b></div><div class="r"><span>U-Bahn</span><b id="metroN">0</b></div></aside><div class="p tools" id="tools"></div><div class="p cats" id="cats"></div><div class="toast" id="toast"></div>
<script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const N=54,S=2.4,H=N*S/2,K={E:0,R:1,RES:2,IND:3,COM:4,PARK:5,METRO:6,PARKING:7},zone=k=>[2,3,4].includes(k);let cells=Array.from({length:N*N},()=>({k:0,built:false,p:0,l:1})),state={money:100000,pop:0,happy:70,speed:1,paused:false,metro:0};let cat='roads',tool='road';
const defs={roads:[['road','Straße',K.R,80]],zones:[['res','Wohnen',K.RES,0],['ind','Fabrik',K.IND,0],['com','Einkauf / Entertainment',K.COM,0]],transport:[['metro','U-Bahn',K.METRO,25000],['parking','Parkplatz',K.PARKING,1500]],nature:[['park','Park',K.PARK,800]],bulldoze:[['doze','Abriss',-1,0]]},catsDef=[['roads','🛣 Straßen'],['zones','🏘 Zonen'],['transport','🚇 Verkehr'],['nature','🌳 Natur'],['bulldoze','🧨 Abriss']];
const $=id=>document.getElementById(id),idx=(x,z)=>z*N+x,ok=(x,z)=>x>=0&&z>=0&&x<N&&z<N,W=(x,z)=>[x*S-H+S/2,z*S-H+S/2],adjRoad=(x,z)=>[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>ok(x+a,z+b)&&cells[idx(x+a,z+b)].k===K.R);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa8c8d7);scene.fog=new THREE.FogExp2(0xb5ccd4,.006);const cam=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,500);const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,1.5));ren.shadowMap.enabled=true;ren.outputColorSpace=THREE.SRGBColorSpace;ren.toneMapping=THREE.ACESFilmicToneMapping;document.body.prepend(ren.domElement);scene.add(new THREE.HemisphereLight(0xeaf7ff,0x49633d,2));let sun=new THREE.DirectionalLight(0xffefcf,2.5);sun.position.set(50,80,20);sun.castShadow=true;scene.add(sun);const city=new THREE.Group(),conG=new THREE.Group(),mobG=new THREE.Group();scene.add(city,conG,mobG);
function tex(base,noise=.12){let c=document.createElement('canvas');c.width=c.height=128;let x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,128,128);for(let i=0;i<1800;i++){let v=(Math.random()-.5)*255*noise;x.fillStyle=`rgba(${v>0?255:0},${v>0?255:0},${v>0?255:0},${Math.abs(v)/255})`;x.fillRect(Math.random()*128,Math.random()*128,1,1)}let t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);return t}const mat={grass:new THREE.MeshStandardMaterial({map:tex('#6b984f'),roughness:1}),road:new THREE.MeshStandardMaterial({map:tex('#343a3e',.18),roughness:.96}),side:new THREE.MeshStandardMaterial({map:tex('#9b9b93',.08),roughness:1}),res:new THREE.MeshStandardMaterial({map:tex('#d1b797',.08),roughness:.82}),ind:new THREE.MeshStandardMaterial({map:tex('#8b8172',.12),roughness:.9}),com:new THREE.MeshPhysicalMaterial({color:0x9cc4d8,metalness:.18,roughness:.25,clearcoat:.3}),metal:new THREE.MeshStandardMaterial({color:0x8a9297,metalness:.75,roughness:.45}),tarp:new THREE.MeshStandardMaterial({color:0xf2f1e9,transparent:true,opacity:.92,side:THREE.DoubleSide,roughness:.9})};let ground=new THREE.Mesh(new THREE.PlaneGeometry(N*S,N*S),mat.grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function box(w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;return o}function road(g,x,z){let [wx,wz]=W(x,z);g.add(box(S,.05,S*.72,mat.road,wx,.03,wz));g.add(box(S,.06,S*.13,mat.side,wx,.04,wz-S*.43));g.add(box(S,.06,S*.13,mat.side,wx,.04,wz+S*.43))}function zonePad(g,x,z,c){let [wx,wz]=W(x,z),col=c.k===K.RES?0x55b56a:c.k===K.IND?0xd0a04e:0x4b91d0;g.add(box(S*.88,.025,S*.88,new THREE.MeshStandardMaterial({color:col,transparent:true,opacity:.32}),wx,.02,wz))}
function building(g,x,z,c){let [wx,wz]=W(x,z),h=c.k===K.RES?1.3+c.l*.25:c.k===K.IND?1.2+c.l*.18:1.7+c.l*.38,m=c.k===K.RES?mat.res:c.k===K.IND?mat.ind:mat.com;g.add(box(S*.64,h,S*.62,m,wx,h/2,wz));g.add(box(S*.58,.12,S*.56,mat.side,wx,h+.06,wz));if(c.k===K.RES){let r=new THREE.Mesh(new THREE.ConeGeometry(S*.34,.5,4),new THREE.MeshStandardMaterial({color:0x784c3d,roughness:1}));r.rotation.y=Math.PI/4;r.position.set(wx,h+.3,wz);g.add(r)}if(c.k===K.IND){let ch=box(.22,.9,.22,mat.metal,wx+.35,h+.4,wz);g.add(ch)}if(c.k===K.COM)for(let y=.4;y<h;y+=.45)g.add(box(S*.5,.17,.03,new THREE.MeshPhysicalMaterial({color:0x8ec7e8,roughness:.18,metalness:.2}),wx,y,wz+S*.315))}
function service(g,x,z,c){let[wx,wz]=W(x,z);if(c.k===K.PARK){g.add(box(S*.9,.05,S*.9,new THREE.MeshStandardMaterial({color:0x4e874a}),wx,.03,wz));return}if(c.k===K.PARKING){g.add(box(S*.9,.04,S*.9,mat.road,wx,.03,wz));for(let i=-2;i<=2;i++)g.add(box(.025,.02,.55,new THREE.MeshStandardMaterial({color:0xffffff}),wx+i*.32,.06,wz));return}if(c.k===K.METRO){g.add(box(S*.72,.08,S*.72,mat.side,wx,.05,wz));g.add(box(.5,.5,.35,mat.com,wx,.3,wz));let s=box(.09,.9,.09,mat.metal,wx+.65,.45,wz);g.add(s);return}}
function rebuild(){city.clear();for(let z=0;z<N;z++)for(let x=0;x<N;x++){let c=cells[idx(x,z)];if(!c.k)continue;let g=new THREE.Group();if(c.k===K.R)road(g,x,z);else if(zone(c.k)){zonePad(g,x,z,c);if(c.built)building(g,x,z,c)}else service(g,x,z,c);city.add(g)}}
function scaff(x,z,c){let[wx,wz]=W(x,z),h=c.k===K.RES?1.55:c.k===K.IND?1.5:2.1,p=c.p,g=new THREE.Group(),sh=Math.max(.04,h*Math.min(1,p/.35)),w=S*.72,d=S*.72;for(let a of [-1,1])for(let b of [-1,1])g.add(box(.045,sh,.045,mat.metal,wx+a*w/2,sh/2,wz+b*d/2));for(let y=.25;y<sh;y+=.3){g.add(box(w,.035,.035,mat.metal,wx,y,wz-d/2));g.add(box(w,.035,.035,mat.metal,wx,y,wz+d/2))}if(p>.42)building(g,x,z,c);let q=Math.max(0,(p-.25)/.75),ty=h+.25-(h+.2)*q;if(p>.2&&p<.99){g.add(box(w+.12,.03,d+.12,mat.tarp,wx,ty,wz));let hh=Math.max(.12,h+.2-ty);for(let a of [-1,1]){g.add(box(.025,hh,d+.12,mat.tarp,wx+a*(w+.12)/2,ty+hh/2,wz));g.add(box(w+.12,hh,.025,mat.tarp,wx,ty+hh/2,wz+a*(d+.12)/2))}}conG.add(g)}
function demand(k){let br=cells.filter(c=>c.k===K.RES&&c.built).length,bi=cells.filter(c=>c.k===K.IND&&c.built).length,bc=cells.filter(c=>c.k===K.COM&&c.built).length;if(k===K.RES)return Math.max(8,Math.min(95,78-state.pop/Math.max(1,br*18)*30));if(k===K.COM)return Math.max(8,Math.min(95,45+state.pop/180-bc*4));return Math.max(8,Math.min(95,52+state.pop/250-bi*4))}
function develop(){let a=[];for(let z=0;z<N;z++)for(let x=0;x<N;x++){let c=cells[idx(x,z)];if(zone(c.k)&&!c.built&&!c.p&&adjRoad(x,z))a.push([x,z,c])}for(let i=0;i<Math.min(3,a.length);i++){let [x,z,c]=a[(Math.random()*a.length)|0];if(Math.random()<demand(c.k)/140)c.p=.001}}
function updateBuild(dt){conG.clear();let done=false;for(let z=0;z<N;z++)for(let x=0;x<N;x++){let c=cells[idx(x,z)];if(c.p&&!c.built){c.p+=dt*.18*state.speed;if(c.p>=1){c.p=0;c.built=true;done=true}else scaff(x,z,c)}}if(done){rebuild();toast('🏢 Gebäude fertig')}}
function path(a,b){let q=[a],prev=new Map([[a.join(','),null]]);while(q.length){let n=q.shift();if(n[0]===b[0]&&n[1]===b[1]){let r=[];for(let k=n;k;k=prev.get(k.join(',')))r.push(k);return r.reverse()}for(let[dX,dZ]of[[1,0],[-1,0],[0,1],[0,-1]]){let x=n[0]+dX,z=n[1]+dZ,k=x+','+z;if(ok(x,z)&&cells[idx(x,z)].k===K.R&&!prev.has(k)){prev.set(k,n);q.push([x,z])}}}return null}function nearRoad(x,z){let best=null,bd=9;for(let zz=z-5;zz<=z+5;zz++)for(let xx=x-5;xx<=x+5;xx++)if(ok(xx,zz)&&cells[idx(xx,zz)].k===K.R){let d=Math.abs(xx-x)+Math.abs(zz-z);if(d<bd){bd=d;best=[xx,zz]}}return best}
let cars=[],npcs=[];function carMesh(){let g=new THREE.Group();g.add(box(.45,.18,.72,new THREE.MeshPhysicalMaterial({color:[0x3f6fa8,0xb64f4f,0xd0c65a,0x5b5b5b][Math.random()*4|0],metalness:.35,roughness:.25}),0,.13,0));g.add(box(.34,.13,.3,mat.com,0,.27,-.03));return g}function person(){let g=new THREE.Group();g.add(box(.13,.35,.13,new THREE.MeshStandardMaterial({color:0x5576a8}),0,.25,0));let h=new THREE.Mesh(new THREE.SphereGeometry(.1,8,6),new THREE.MeshStandardMaterial({color:0xd9ad86}));h.position.y=.52;g.add(h);return g}
function spawnTrip(){let homes=[],dest=[];for(let z=0;z<N;z++)for(let x=0;x<N;x++){let c=cells[idx(x,z)];if(c.built&&c.k===K.RES)homes.push([x,z]);if(c.built&&(c.k===K.IND||c.k===K.COM))dest.push([x,z])}if(!homes.length||!dest.length||cars.length>55)return;let h=homes[Math.random()*homes.length|0],d=dest[Math.random()*dest.length|0],a=nearRoad(...h),b=nearRoad(...d);if(!a||!b)return;let p=path(a,b);if(!p||p.length<2)return;let metro=cells.filter(c=>c.k===K.METRO).length>=2&&Math.random()<.28;if(metro){state.metro++;let m=person(),[wx,wz]=W(...h);m.position.set(wx,.08,wz);mobG.add(m);npcs.push({m,t:1.8});return}let m=carMesh();mobG.add(m);cars.push({m,p,i:0,t:0})}
function updateMob(dt){if(Math.random()<dt*.8)spawnTrip();for(let i=cars.length-1;i>=0;i--){let a=cars[i];a.t+=dt*1.6;if(a.t>=1){a.t=0;a.i++;if(a.i>=a.p.length-1){mobG.remove(a.m);cars.splice(i,1);continue}}let A=W(...a.p[a.i]),B=W(...a.p[a.i+1]),t=a.t;a.m.position.set(A[0]+(B[0]-A[0])*t,.08,A[1]+(B[1]-A[1])*t);a.m.rotation.y=Math.atan2(B[0]-A[0],B[1]-A[1])}for(let i=npcs.length-1;i>=0;i--){npcs[i].t-=dt;if(npcs[i].t<=0){mobG.remove(npcs[i].m);npcs.splice(i,1)}}}
function sim(){develop();let res=cells.filter(c=>c.k===K.RES&&c.built).length,ind=cells.filter(c=>c.k===K.IND&&c.built).length,com=cells.filter(c=>c.k===K.COM&&c.built).length;state.pop+=(Math.min(res*18,(ind*20+com*14)*1.6+20)-state.pop)*.04;state.happy=Math.max(30,Math.min(95,70+cells.filter(c=>c.k===K.PARK).length*2-cars.length*.25));state.money+=(state.pop*.18+ind*7+com*9-cells.filter(c=>c.k===K.R).length*.3);$('dr').textContent=demand(K.RES)|0+'%';$('dc').textContent=demand(K.COM)|0+'%';$('di').textContent=demand(K.IND)|0+'%';$('money').textContent=Math.round(state.money).toLocaleString('de-DE');$('pop').textContent=Math.round(state.pop);$('happy').textContent=Math.round(state.happy)+'%';$('carsN').textContent=cars.length;$('npcsN').textContent=npcs.length;let lots=cells.filter(c=>c.k===K.PARKING).length*10;$('parkN').textContent=Math.min(cars.length,lots)+'/'+lots;$('metroN').textContent=state.metro}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);function pick(e){let r=ren.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,cam);let p=new THREE.Vector3();if(!ray.ray.intersectPlane(plane,p))return null;let x=Math.floor((p.x+H)/S),z=Math.floor((p.z+H)/S);return ok(x,z)?{x,z}:null}function line(a,b){let o=[],x=a.x,z=a.z,dx=Math.abs(b.x-x),dz=Math.abs(b.z-z),sx=x<b.x?1:-1,sz=z<b.z?1:-1,e=dx-dz;for(;;){o.push({x,z});if(x===b.x&&z===b.z)break;let e2=2*e;if(e2>-dz){e-=dz;x+=sx}if(e2<dx){e+=dx;z+=sz}}return o}
function apply(ps){let d=defs[cat].find(x=>x[0]===tool);for(let p of ps){let c=cells[idx(p.x,p.z)];if(cat==='bulldoze'){cells[idx(p.x,p.z)]={k:0,built:false,p:0,l:1};continue}if(c.k)continue;if(zone(d[2])&&!adjRoad(p.x,p.z))continue;if(state.money<d[3])continue;state.money-=d[3];cells[idx(p.x,p.z)]={k:d[2],built:!zone(d[2]),p:0,l:1}}rebuild()}
let drag=null,orbit=false,last={x:0,y:0},az=.78,el=.78,dist=78,target=new THREE.Vector3();ren.domElement.oncontextmenu=e=>e.preventDefault();ren.domElement.addEventListener('pointerdown',e=>{last={x:e.clientX,y:e.clientY};if(e.button===2){orbit=true;return}drag=pick(e)});ren.domElement.addEventListener('pointermove',e=>{if(orbit){az-=(e.clientX-last.x)*.006;el=Math.max(.25,Math.min(1.35,el+(e.clientY-last.y)*.006));last={x:e.clientX,y:e.clientY}}});ren.domElement.addEventListener('pointerup',e=>{if(orbit){orbit=false;return}if(drag){let b=pick(e)||drag;apply(line(drag,b));drag=null}});ren.domElement.addEventListener('wheel',e=>dist=Math.max(24,Math.min(150,dist+e.deltaY*.05)),{passive:true});
function renderUI(){cats.innerHTML='';for(let c of catsDef){let b=document.createElement('button');b.className='btn '+(c[0]===cat?'on':'');b.textContent=c[1];b.onclick=()=>{cat=c[0];tool=defs[cat][0][0];renderUI()};cats.appendChild(b)}tools.innerHTML='';for(let t of defs[cat]){let b=document.createElement('button');b.className='tool '+(t[0]===tool?'on':'');b.textContent=t[1];b.onclick=()=>{tool=t[0];renderUI()};tools.appendChild(b)}}function toast(t){let e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e.t);e.t=setTimeout(()=>e.style.opacity=0,1300)}$('pause').onclick=()=>{state.paused=!state.paused;$('pause').textContent=state.paused?'▶':'⏸'};$('speed').onclick=()=>{state.speed=state.speed===1?2:state.speed===2?4:1;$('speed').textContent=state.speed+'×'};$('save').onclick=()=>{localStorage.setItem('sliqadoCityCompact',JSON.stringify({cells,state}));toast('Gespeichert')};let v=localStorage.getItem('sliqadoCityCompact');if(v)try{let o=JSON.parse(v);cells=o.cells;state={...state,...o.state}}catch{}if(!cells.some(c=>c.k)){let z=N>>1;for(let x=z-8;x<=z+8;x++)cells[idx(x,z)]={k:K.R,built:true,p:0,l:1}}renderUI();rebuild();let lastT=0,simT=0;function loop(t){requestAnimationFrame(loop);let dt=Math.min(.05,(t-lastT)/1000||.016);lastT=t;if(!state.paused){updateBuild(dt);updateMob(dt*state.speed);if(t-simT>900/state.speed){sim();simT=t}}cam.position.set(Math.cos(az)*Math.cos(el)*dist,Math.sin(el)*dist,Math.sin(az)*Math.cos(el)*dist);cam.lookAt(target);ren.render(scene,cam)}loop(0);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});setInterval(()=>$('save').click(),25000);
</script></body></html>
