<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0d12">
<title>Qevyno</title>
<style>
:root{--bg:#0a0d12;--panel:#121821;--panel2:#19212c;--line:#263242;--text:#f4f7fa;--muted:#8e9aab;--green:#39e58c;--green2:#1fb66d;--danger:#ff6868}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}button,input,textarea{font:inherit}button{border:0}.app{height:100%;max-width:760px;margin:auto;display:flex;flex-direction:column;background:var(--bg)}.screen{display:none;height:100%;flex-direction:column}.screen.active{display:flex}.topbar{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid rgba(255,255,255,.055);background:rgba(10,13,18,.96)}.brand{font-size:25px;font-weight:900;letter-spacing:-.8px}.dot{color:var(--green)}.spacer{flex:1}.iconbtn{min-width:44px;height:44px;border-radius:14px;background:var(--panel2);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:20px}.auth{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 22px calc(28px + env(safe-area-inset-bottom))}.logo{font-size:43px;font-weight:950;letter-spacing:-1.8px}.tag{color:var(--muted);margin:6px 0 24px;font-size:15px}.field{width:100%;height:56px;margin-top:11px;border:1px solid var(--line);outline:none;background:var(--panel);color:var(--text);border-radius:17px;padding:0 16px;font-size:16px}.field:focus{border-color:var(--green)}.primary,.secondary{width:100%;height:54px;border-radius:17px;font-weight:850;margin-top:12px}.primary{background:var(--green);color:#06100b}.secondary{background:var(--panel2);color:var(--text)}.error{min-height:20px;color:var(--danger);font-size:13px;margin-top:10px}.hint{font-size:12px;color:var(--muted);line-height:1.45;margin-top:10px}.homeHead{padding:20px 17px 10px}.hello{font-size:13px;color:var(--muted)}.homeTitle{font-size:30px;font-weight:900;letter-spacing:-1px}.lookup{padding:0 16px 12px}.lookupRow{display:flex;gap:8px}.lookupRow .field{margin:0;flex:1}.lookupRow button{width:auto;min-width:92px;margin:0}.people{overflow-y:auto;padding:0 12px 100px}.sectionLabel{font-size:12px;color:var(--muted);padding:12px 6px 4px;text-transform:uppercase;letter-spacing:.08em}.person{display:flex;align-items:center;gap:13px;padding:13px;border-radius:18px;margin:5px 0;background:var(--panel)}.person:active{background:var(--panel2)}.avatar{width:48px;height:48px;min-width:48px;border-radius:50%;background:var(--green);color:#06100b;font-weight:950;font-size:19px;display:flex;align-items:center;justify-content:center}.pinfo{min-width:0;flex:1}.pname{font-weight:820;font-size:16px;overflow:hidden;text-overflow:ellipsis}.presence{font-size:12px;color:var(--muted);margin-top:3px}.online{color:var(--green)}.preview{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}.badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--green);color:#06100b;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}.empty{text-align:center;color:var(--muted);padding:50px 20px;line-height:1.55}.chatTitle{min-width:0}.chatName{font-weight:850;font-size:17px;overflow:hidden;text-overflow:ellipsis}.chatPresence{font-size:11px;color:var(--muted);margin-top:1px}.messages{flex:1;overflow-y:auto;padding:12px 12px 18px;display:flex;flex-direction:column;gap:7px}.bubbleRow{display:flex;width:100%}.bubbleRow.mine{justify-content:flex-end}.bubble{max-width:82%;padding:10px 12px 7px;border-radius:18px 18px 18px 5px;background:var(--panel2)}.mine .bubble{background:#1f7449;border-radius:18px 18px 5px 18px}.btext{font-size:15.5px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}.meta{text-align:right;color:#c6cdd5;font-size:10.5px;margin-top:4px}.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.055);background:var(--bg)}.composer textarea{flex:1;resize:none;max-height:120px;min-height:50px;border:1px solid var(--line);outline:none;background:var(--panel);color:var(--text);border-radius:17px;padding:13px 14px}.send{height:50px;padding:0 17px;border-radius:16px;background:var(--green);color:#06100b;font-weight:900}.sheetBack{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:30}.sheetBack.open{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#111720;border-radius:25px 25px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));border:1px solid var(--line)}.sheet h2{margin:0 0 4px}.sheet p{margin:0 0 10px;color:var(--muted);font-size:13px}.small{font-size:12px;color:var(--muted)}.conn{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);background:#5a2323;color:#ffd4d4;border-radius:30px;padding:6px 11px;font-size:11px;display:none;z-index:50}.conn.show{display:block}
</style>
</head>
<body>
<div class="app">
<div class="conn" id="conn">Server unreachable</div>
<section class="screen active" id="authScreen"><div class="auth"><div class="logo">Qevyno<span class="dot">.</span></div><div class="tag">Private messaging through the Qevyno server.</div><input class="field" id="displayName" maxlength="32" placeholder="Display name (new accounts only)"><input class="field" id="phone" inputmode="tel" autocomplete="tel" placeholder="Phone number, e.g. +4917612345678"><input class="field" id="password" type="password" autocomplete="current-password" placeholder="Password"><button class="primary" id="loginBtn">Log in</button><button class="secondary" id="registerBtn">Create account</button><div class="error" id="authError"></div><div class="hint">Your phone number is your Qevyno ID. Qevyno only finds someone when you enter their exact number. SMS verification is not enabled yet.</div></div></section>
<section class="screen" id="homeScreen"><div class="topbar"><div class="brand">Qevyno<span class="dot">.</span></div><div class="spacer"></div><button class="iconbtn" id="settingsBtn">⚙</button></div><div class="homeHead"><div class="hello" id="hello"></div><div class="homeTitle">Messages</div></div><div class="lookup"><div class="lookupRow"><input class="field" id="findPhone" inputmode="tel" placeholder="Enter exact phone number"><button class="primary" id="findBtn">Find</button></div><div class="error" id="findError"></div></div><div class="people" id="people"></div></section>
<section class="screen" id="chatScreen"><div class="topbar"><button class="iconbtn" id="backBtn">‹</button><div class="chatTitle"><div class="chatName" id="chatName"></div><div class="chatPresence" id="chatPresence"></div></div><div class="spacer"></div></div><div class="messages" id="messages"></div><div class="composer"><textarea rows="1" id="messageBox" maxlength="4000" placeholder="Message"></textarea><button class="send" id="sendBtn">Send</button></div></section>
</div>
<div class="sheetBack" id="sheetBack"><div class="sheet"><h2>Qevyno settings</h2><p id="accountInfo"></p><input class="field" id="serverInput" placeholder="https://qevyno.sliqado.org"><button class="primary" id="saveServerBtn">Save server</button><button class="secondary" id="logoutBtn">Log out</button><button class="secondary" id="closeSheetBtn">Cancel</button><div class="small" style="margin-top:12px">Qevyno 2.0 • Android 8+</div></div></div>
<script>
const DEFAULT_SERVER='https://qevyno.sliqado.org';
let server=localStorage.getItem('qevyno_server')||DEFAULT_SERVER;
let token=localStorage.getItem('qevyno_token')||'';
let mePhone=localStorage.getItem('qevyno_phone')||'';
let meName=localStorage.getItem('qevyno_name')||'';
let peer=null,pollHome=null,pollChat=null,lastRenderKey='';
const $=id=>document.getElementById(id),screens=['authScreen','homeScreen','chatScreen'];
function show(id){screens.forEach(x=>$(x).classList.toggle('active',x===id))}
function normalizeServer(s){s=(s||'').trim().replace(/\/+$/,'');if(!/^https?:\/\//i.test(s))s='https://'+s;return s}
function connectionBad(b){$('conn').classList.toggle('show',!!b)}
function normalizePhone(p){p=(p||'').trim().replace(/[\s().-]/g,'');if(p.startsWith('00'))p='+'+p.slice(2);return p}
async function api(path,method='GET',body=null,auth=true){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),8000);try{const h={'Accept':'application/json'};if(body)h['Content-Type']='application/json';if(auth&&token)h['Authorization']='Bearer '+token;const res=await fetch(server+path,{method,headers:h,body:body?JSON.stringify(body):undefined,signal:ctl.signal});let d=null;try{d=await res.json()}catch(_){}connectionBad(false);return d||{ok:false,error:'bad_response'}}catch(e){connectionBad(true);return{ok:false,error:'server_unreachable'}}finally{clearTimeout(timer)}}
function saveSession(d){token=d.token||'';mePhone=d.phone||'';meName=d.display_name||'';localStorage.setItem('qevyno_token',token);localStorage.setItem('qevyno_phone',mePhone);localStorage.setItem('qevyno_name',meName)}
function clearSession(){token='';mePhone='';meName='';peer=null;localStorage.removeItem('qevyno_token');localStorage.removeItem('qevyno_phone');localStorage.removeItem('qevyno_name');stopPolls()}
function stopPolls(){if(pollHome){clearInterval(pollHome);pollHome=null}if(pollChat){clearInterval(pollChat);pollChat=null}}
async function login(reg){const phone=normalizePhone($('phone').value),password=$('password').value,display_name=$('displayName').value.trim();$('authError').textContent='';if(!/^\+[1-9]\d{7,14}$/.test(phone)){$('authError').textContent='Use an international number such as +4917612345678.';return}if(password.length<6){$('authError').textContent='Password needs at least 6 characters.';return}if(reg&&(display_name.length<2||display_name.length>32)){$('authError').textContent='Display name needs 2–32 characters.';return}const body=reg?{phone,password,display_name}:{phone,password};const r=await api(reg?'/api/register':'/api/login','POST',body,false);if(r&&r.ok){saveSession(r);$('password').value='';home()}else{const map={phone_taken:'This phone number already has an account.',invalid_login:'Wrong phone number or password.',invalid_phone:'Use an international phone number beginning with +.',invalid_display_name:'Display name needs 2–32 characters.',password_too_short:'Password needs at least 6 characters.',server_unreachable:'Qevyno server is unreachable.'};$('authError').textContent=map[r&&r.error]||(r&&r.error)||'Could not log in.'}}
async function verify(){if(!token){auth();return}const r=await api('/api/me');if(r&&r.ok){mePhone=r.phone||mePhone;meName=r.display_name||meName;saveSession({...r,token});home()}else{clearSession();auth()}}
function auth(){stopPolls();peer=null;show('authScreen')}
async function home(){stopPolls();peer=null;show('homeScreen');$('hello').textContent=(meName||'Qevyno')+' • '+mePhone;$('findError').textContent='';await loadConversations();pollHome=setInterval(loadConversations,3500)}
async function loadConversations(){if(!token)return;const r=await api('/api/conversations');if(!r||!r.ok){if(r&&r.error==='unauthorized'){clearSession();auth()}return}renderConversations(r.conversations||[])}
function renderConversations(list){const box=$('people');box.innerHTML='<div class="sectionLabel">Recent chats</div>';if(!list.length){box.innerHTML+='<div class="empty">No chats yet.<br>Enter someone\'s exact phone number above.</div>';return}list.forEach(u=>{const row=document.createElement('div');row.className='person';const initial=((u.display_name||u.phone||'?')[0]||'?').toUpperCase();row.innerHTML='<div class="avatar">'+esc(initial)+'</div><div class="pinfo"><div class="pname">'+esc(u.display_name||u.phone)+'</div><div class="presence '+(u.online?'online':'')+'">'+esc(u.phone)+' • '+(u.online?'● Online':'Offline')+'</div><div class="preview">'+esc(u.last_message||'')+'</div></div>'+(u.unread?'<div class="badge">'+Math.min(99,u.unread)+'</div>':'');row.onclick=()=>openChat(u.phone,u.display_name||u.phone,!!u.online,true);box.appendChild(row)})}
async function findPerson(){const phone=normalizePhone($('findPhone').value);$('findError').textContent='';if(!/^\+[1-9]\d{7,14}$/.test(phone)){$('findError').textContent='Enter the full international number, e.g. +49…';return}const r=await api('/api/find?phone='+encodeURIComponent(phone));if(r&&r.ok){openChat(r.user.phone,r.user.display_name||r.user.phone,!!r.user.online,true)}else{const map={not_found:'No Qevyno account exists for that number.',self:'That is your own number.',server_unreachable:'Qevyno server is unreachable.'};$('findError').textContent=map[r&&r.error]||(r&&r.error)||'Could not find that account.'}}
function openChat(phone,name,online,push){stopPolls();peer={phone,name};$('chatName').textContent=name;$('chatPresence').textContent=phone+' • '+(online?'● Online':'Offline');$('chatPresence').className='chatPresence '+(online?'online':'');$('messages').innerHTML='';lastRenderKey='';show('chatScreen');if(push)history.pushState({chat:phone},'','#chat');loadMessages();pollChat=setInterval(()=>{loadMessages();refreshPresence()},1500)}
function closeChat(){if(!peer)return;stopPolls();peer=null;lastRenderKey='';home()}
async function refreshPresence(){if(!peer)return;const r=await api('/api/find?phone='+encodeURIComponent(peer.phone));if(r&&r.ok){peer.name=r.user.display_name||peer.name;$('chatName').textContent=peer.name;$('chatPresence').textContent=peer.phone+' • '+(r.user.online?'● Online':'Offline');$('chatPresence').className='chatPresence '+(r.user.online?'online':'')}}
async function loadMessages(){if(!peer)return;const r=await api('/api/messages?with='+encodeURIComponent(peer.phone));if(r&&r.ok)renderMessages(r.messages||[])}
function renderMessages(arr){const key=arr.map(m=>[m.id,m.read_at].join(':')).join('|');if(key===lastRenderKey)return;lastRenderKey=key;const box=$('messages');box.innerHTML='';arr.forEach(m=>{const mine=(m.sender_phone||'')===mePhone,row=document.createElement('div');row.className='bubbleRow'+(mine?' mine':'');const bubble=document.createElement('div');bubble.className='bubble';const text=document.createElement('div');text.className='btext';text.textContent=m.text||'';const meta=document.createElement('div');meta.className='meta';const time=new Date((m.sent_at||0)*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});meta.textContent=time+(mine?(m.read_at?'  ✓✓':'  ✓'):'');bubble.append(text,meta);row.appendChild(bubble);box.appendChild(row)});box.scrollTop=box.scrollHeight}
async function send(){const text=$('messageBox').value.trim();if(!text||!peer)return;$('messageBox').value='';resizeMessageBox();const r=await api('/api/send','POST',{to:peer.phone,text});if(!r||!r.ok){$('messageBox').value=text;alert('Message could not be sent.');return}await loadMessages()}
function resizeMessageBox(){const e=$('messageBox');e.style.height='auto';e.style.height=Math.min(e.scrollHeight,120)+'px'}
function openSettings(){$('serverInput').value=server;$('accountInfo').textContent=(meName||'')+(mePhone?' • '+mePhone:'');$('sheetBack').classList.add('open')}
function closeSettings(){$('sheetBack').classList.remove('open')}
function saveServer(){const v=normalizeServer($('serverInput').value);if(!v)return;server=v;localStorage.setItem('qevyno_server',server);connectionBad(false);closeSettings();if(token)loadConversations()}
async function logout(){try{await api('/api/logout','POST',{})}catch(_){}clearSession();closeSettings();auth()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
$('loginBtn').onclick=()=>login(false);$('registerBtn').onclick=()=>login(true);$('settingsBtn').onclick=openSettings;$('saveServerBtn').onclick=saveServer;$('logoutBtn').onclick=logout;$('closeSheetBtn').onclick=closeSettings;$('sheetBack').onclick=e=>{if(e.target===$('sheetBack'))closeSettings()};$('findBtn').onclick=findPerson;$('findPhone').addEventListener('keydown',e=>{if(e.key==='Enter')findPerson()});$('backBtn').onclick=()=>history.back();$('sendBtn').onclick=send;$('messageBox').addEventListener('input',resizeMessageBox);$('messageBox').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});window.addEventListener('popstate',()=>{if(peer)closeChat()});window.addEventListener('focus',()=>{if(peer){loadMessages();refreshPresence()}else if(token)loadConversations()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(peer){loadMessages();refreshPresence()}else if(token)loadConversations()}});verify();
</script>
</body>
</html>
