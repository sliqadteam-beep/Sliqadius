name: Bump SliqServer Sharpness
on:
  push:
    paths:
      - '.github/workflows/bump-sliqserver-sharpness.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump sharpness CSS version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('/server/logo-quality.css?v=2','/server/logo-quality.css?v=3')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Force fresh crisp SliqServer CSS"
          git pull --rebase origin main
          git push
