name: Build SandBox Android APK

on:
  push:
    branches: [main]
    paths:
      - 'sandbox-android/**'
      - '.github/workflows/sandbox-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Give phone-test APK a separate app ID
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sandbox-android/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('applicationId = "org.sliqado.sandbox"', 'applicationId = "org.sliqado.sandbox.phonetest"')
          s = s.replace('versionName = "3.0"', 'versionName = "3.0-phone-test"')
          s = s.replace('versionName = "2.0-offline"', 'versionName = "3.0-phone-test"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply fire and steam lifetime fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sandbox-android/app/src/main/java/org/sliqado/sandbox/GameView.kt')
          s = p.read_text(encoding='utf-8')
          old_gas = "            STEAM, SMOKE, GAS -> {\n                life[i] = ((life[i].toInt() and 0xffff) + 1).coerceAtMost(32767).toShort()\n                gas(x, y, 3)\n                if ((life[i].toInt() and 0xffff) > 420 && t != GAS) clearCell(i)\n            }\n"
          new_gas = "            STEAM, SMOKE, GAS -> {\n                val age = (life[i].toInt() and 0xffff) + 1\n                life[i] = age.coerceAtMost(32767).toShort()\n                val j = gas(x, y, 3)\n                when (t) {\n                    STEAM -> {\n                        temp[j] -= .45f\n                        if (age >= 180) {\n                            type[j] = WATER.toByte()\n                            life[j] = 0\n                            temp[j] = min(temp[j], 82f)\n                        }\n                    }\n                    SMOKE -> if (age >= 260) clearCell(j)\n                    GAS -> Unit\n                }\n            }\n"
          old_fire = "                val age = life[i].toInt() and 0xffff\n                if (age > 80 + rnd.nextInt(100)) {\n                    type[i] = if (rnd.nextFloat() < .55f) SMOKE.toByte() else ASH.toByte()\n                    life[i] = 0\n                    return\n                }\n                gas(x, y, 2)\n"
          new_fire = "                val age = life[i].toInt() and 0xffff\n                if (age >= 110) {\n                    if (rnd.nextFloat() < .68f) {\n                        type[i] = SMOKE.toByte()\n                        life[i] = 0\n                        temp[i] = 170f\n                    } else if (rnd.nextFloat() < .55f) {\n                        type[i] = ASH.toByte()\n                        life[i] = 0\n                        temp[i] = 45f\n                    } else {\n                        clearCell(i)\n                    }\n                    return\n                }\n                gas(x, y, 2)\n"
          if old_gas not in s:
              raise SystemExit('Expected steam block not found')
          if old_fire not in s:
              raise SystemExit('Expected fire block not found')
          p.write_text(s.replace(old_gas, new_gas).replace(old_fire, new_fire), encoding='utf-8')
          PY
      - name: Build debug APK
        run: gradle -p sandbox-android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SandBox-Phone-Test-APK-Separate-ID
          path: sandbox-android/app/build/outputs/apk/debug/app-debug.apk
