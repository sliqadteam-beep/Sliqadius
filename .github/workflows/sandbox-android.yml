name: Build SandBox Android APK

on:
  push:
    branches: [main]
    paths:
      - 'sandbox-android/**'
      - '.github/workflows/sandbox-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply V3.2 phone-test improvements
        run: python sandbox-android/phone_test_v32.py
      - name: Build debug APK
        run: gradle -p sandbox-android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SandBox-V3.2-Phone-Test-APK
          path: sandbox-android/app/build/outputs/apk/debug/app-debug.apk
