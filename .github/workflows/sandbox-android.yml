name: Build SandBox Android APK

on:
  push:
    branches: [main]
    paths:
      - 'sandbox-android/**'
      - '.github/workflows/sandbox-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply V3.2 phone-test improvements
        run: python sandbox-android/phone_test_v32.py
      - name: Build debug APK
        run: gradle -p sandbox-android assembleDebug --stacktrace
      - name: Re-sign for Android compatibility
        shell: bash
        run: |
          set -e
          PASS="$(openssl rand -hex 16)"
          KEYSTORE="$RUNNER_TEMP/sandbox-test.jks"
          ALIGNED="$RUNNER_TEMP/SandBox-V3.2-Fix-aligned.apk"
          FINAL="$RUNNER_TEMP/SandBox-V3.2-Fix.apk"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias sandbox -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=SandBox Test, OU=Test, O=Sliqado, L=Berlin, ST=Berlin, C=DE"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 sandbox-android/app/build/outputs/apk/debug/app-debug.apk "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$FINAL" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$FINAL"
      - uses: actions/upload-artifact@v4
        with:
          name: SandBox-V3.2-Install-Fix-APK
          path: ${{ runner.temp }}/SandBox-V3.2-Fix.apk
