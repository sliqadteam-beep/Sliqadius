name: Apply Sliqadius logo branding

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - logo_source.jpg.b64
      - apply_logo_branding.py
      - .github/workflows/apply-logo-branding.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Apply logo to website and apps
        run: python apply_logo_branding.py

      - name: Commit branding changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add logo.png index.html web.html README.md Sliqadius.py Sliqadius.ico Sliqadius.icns android/app/src/main/res .github/workflows/windows-build.yml .github/workflows/macos-build.yml
          if git diff --cached --quiet; then
            echo 'No branding changes needed.'
          else
            git commit -m 'Apply new Sliqadius logo across platforms'
            git push origin main
          fi
