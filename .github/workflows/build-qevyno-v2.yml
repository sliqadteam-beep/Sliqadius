name: Validate Qevyno Android
on:
  push:
    branches: [main]
    paths:
      - 'android/Qevyno/**'
      - '.github/workflows/build-qevyno-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qevyno-android-validation
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Validate unsigned release build
        working-directory: android/Qevyno
        run: gradle --no-daemon clean assembleRelease
