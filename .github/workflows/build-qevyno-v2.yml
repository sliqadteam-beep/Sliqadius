name: Build Qevyno Android v2
on:
  push:
    branches: [main]
    paths:
      - 'android/Qevyno/**'
      - '.github/workflows/build-qevyno-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qevyno-v2-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: qevyno-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Build APK
        working-directory: android/Qevyno
        run: gradle --no-daemon clean assembleDebug
      - name: Publish APK only to /Qevyno
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp android/Qevyno/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Qevyno.apk"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p Qevyno
            cp "$RUNNER_TEMP/Qevyno.apk" Qevyno/Qevyno.apk
            git add Qevyno/Qevyno.apk
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Build Qevyno Android 2.9.3"
            if git push origin main; then exit 0; fi
            sleep 3
          done
          exit 1
