name: Apply desktop mode and language features

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ci_mode_language_patch.py
      - .github/workflows/apply-mode-language-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply features
        run: python ci_mode_language_patch.py

      - name: Commit updated desktop source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sliqadius.py
          git diff --cached --quiet && exit 0
          git commit -m 'Add AI modes and automatic system language'
          git push origin main
