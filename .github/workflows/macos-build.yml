name: Build and Release Sliqadius for macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Sliqadius.py
      - index.html
      - .github/workflows/macos-build.yml

permissions:
  contents: write

jobs:
  build_apple:
    name: Build macOS Apple Silicon
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 requests Pillow pyinstaller
      - name: Check source
        run: python -m py_compile Sliqadius.py
      - name: Build app
        run: |
          pyinstaller --noconfirm --clean --windowed --name Sliqadius Sliqadius.py
          test -d dist/Sliqadius.app
          mkdir -p dist/Sliqadius-macOS
          cp -R dist/Sliqadius.app dist/Sliqadius-macOS/Sliqadius.app
          printf '%s\n' '#!/bin/bash' 'cd "$(dirname "$0")"' 'open "Sliqadius.app"' > dist/Sliqadius-macOS/START-Sliqadius.command
          chmod +x dist/Sliqadius-macOS/START-Sliqadius.command
          printf '%s\n' 'SLIQADIUS - MACOS START' '' '1. Open START-Sliqadius.command to start the app.' '2. If macOS blocks it, right-click Sliqadius.app and choose Open.' '3. You can also double-click Sliqadius.app directly.' '' 'Apple Silicon: M1, M2, M3, M4' > dist/Sliqadius-macOS/README-Mac.txt
          ditto -c -k --sequesterRsrc --keepParent dist/Sliqadius-macOS dist/Sliqadius-macOS-Apple-Silicon.zip
      - name: Test app package
        run: |
          test -d dist/Sliqadius-macOS/Sliqadius.app
          test -x dist/Sliqadius-macOS/START-Sliqadius.command
          test -f dist/Sliqadius-macOS/README-Mac.txt
          test -x dist/Sliqadius-macOS/Sliqadius.app/Contents/MacOS/Sliqadius
          unzip -t dist/Sliqadius-macOS-Apple-Silicon.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-Apple-Silicon
          path: dist/Sliqadius-macOS-Apple-Silicon.zip
          if-no-files-found: error

  build_intel:
    name: Build macOS Intel
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 requests Pillow pyinstaller
      - name: Check source
        run: python -m py_compile Sliqadius.py
      - name: Build app
        run: |
          pyinstaller --noconfirm --clean --windowed --name Sliqadius Sliqadius.py
          test -d dist/Sliqadius.app
          mkdir -p dist/Sliqadius-macOS
          cp -R dist/Sliqadius.app dist/Sliqadius-macOS/Sliqadius.app
          printf '%s\n' '#!/bin/bash' 'cd "$(dirname "$0")"' 'open "Sliqadius.app"' > dist/Sliqadius-macOS/START-Sliqadius.command
          chmod +x dist/Sliqadius-macOS/START-Sliqadius.command
          printf '%s\n' 'SLIQADIUS - MACOS START' '' '1. Open START-Sliqadius.command to start the app.' '2. If macOS blocks it, right-click Sliqadius.app and choose Open.' '3. You can also double-click Sliqadius.app directly.' '' 'Intel Mac' > dist/Sliqadius-macOS/README-Mac.txt
          ditto -c -k --sequesterRsrc --keepParent dist/Sliqadius-macOS dist/Sliqadius-macOS-Intel.zip
      - name: Test app package
        run: |
          test -d dist/Sliqadius-macOS/Sliqadius.app
          test -x dist/Sliqadius-macOS/START-Sliqadius.command
          test -f dist/Sliqadius-macOS/README-Mac.txt
          test -x dist/Sliqadius-macOS/Sliqadius.app/Contents/MacOS/Sliqadius
          unzip -t dist/Sliqadius-macOS-Intel.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-Intel
          path: dist/Sliqadius-macOS-Intel.zip
          if-no-files-found: error

  release:
    name: Publish macOS downloads
    needs:
      - build_apple
      - build_intel
    runs-on: ubuntu-latest
    steps:
      - name: Download Apple Silicon
        uses: actions/download-artifact@v4
        with:
          name: macos-Apple-Silicon
          path: dist
      - name: Download Intel
        uses: actions/download-artifact@v4
        with:
          name: macos-Intel
          path: dist
      - name: Create combined package
        run: |
          mkdir -p combined/Sliqadius-macOS
          cp dist/Sliqadius-macOS-Apple-Silicon.zip combined/Sliqadius-macOS/
          cp dist/Sliqadius-macOS-Intel.zip combined/Sliqadius-macOS/
          printf '%s\n' 'SLIQADIUS - MACOS EINFACH STARTEN' '' 'M1, M2, M3, M4: use Sliqadius-macOS-Apple-Silicon.zip' 'Intel Mac: use Sliqadius-macOS-Intel.zip' '' 'After opening the matching ZIP, double-click START-Sliqadius.command.' 'You can also double-click Sliqadius.app.' > combined/Sliqadius-macOS/START-HERE-Mac.txt
          cd combined
          zip -qr ../dist/Sliqadius-macOS.zip Sliqadius-macOS
          unzip -t ../dist/Sliqadius-macOS.zip
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=macos-v1.0.0
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Sliqadius macOS v1.0.0" --notes "Sliqadius macOS downloads for Apple Silicon and Intel." --target "$GITHUB_SHA"
          gh release upload "$TAG" dist/Sliqadius-macOS-Apple-Silicon.zip --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" dist/Sliqadius-macOS-Intel.zip --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" dist/Sliqadius-macOS.zip --clobber --repo "$GITHUB_REPOSITORY"
