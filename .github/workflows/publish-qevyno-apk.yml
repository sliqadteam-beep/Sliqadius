name: Publish Qevyno APK

on:
  push:
    branches: [main]
    paths:
      - 'Qevyno/index.html'
      - '.github/workflows/publish-qevyno-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact Qevyno APK
        run: |
          set -euo pipefail
          mkdir -p Qevyno
          curl -fL "https://raw.githubusercontent.com/sliqadteam-beep/SliqGames/673d4ac0fde1b00536e0348eb3b6903dd43c4d9f/Qevyno/Qevyno.apk" -o Qevyno/Qevyno.apk
          test -s Qevyno/Qevyno.apk

      - name: Publish only Qevyno APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Qevyno/Qevyno.apk
          if git diff --cached --quiet; then
            echo "APK already current"
            exit 0
          fi
          git commit -m "Publish Qevyno APK at /Qevyno"
          git push origin main
