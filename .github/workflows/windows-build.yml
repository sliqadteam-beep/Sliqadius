name: Build and Release Sliqadius for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Sliqadius.py
      - ci_mode_language_patch.py
      - ci_logo_patch.py
      - ci_desktop_icons.py
      - logo-approved.jpg
      - .github/workflows/windows-build.yml

permissions:
  contents: write

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 requests Pillow pyinstaller

      - name: Apply desktop mode and language features
        shell: pwsh
        run: python ci_mode_language_patch.py

      - name: Apply approved Sliqadius logo
        shell: pwsh
        run: python ci_logo_patch.py

      - name: Create native Windows icon
        shell: pwsh
        run: |
          python ci_desktop_icons.py --windows
          if (!(Test-Path 'Sliqadius.ico')) { throw 'Sliqadius.ico wurde nicht erstellt.' }
          python -c "from PIL import Image; im=Image.open('Sliqadius.ico'); sizes=set(im.info.get('sizes',set())); required={(16,16),(32,32),(48,48),(128,128),(256,256)}; missing=required-sizes; assert not missing, f'Missing ICO sizes: {missing}'; print('ICO_OK',sorted(sizes))"

      - name: Check source
        shell: pwsh
        run: python -m py_compile Sliqadius.py

      - name: Build executable with embedded icon
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name Sliqadius --icon Sliqadius.ico --add-data "logo-approved.jpg;." Sliqadius.py
          if (!(Test-Path 'dist/Sliqadius.exe')) { throw 'Sliqadius.exe wurde nicht erstellt.' }
          $size=(Get-Item 'dist/Sliqadius.exe').Length
          if ($size -lt 1000000) { throw 'Sliqadius.exe ist unerwartet klein.' }

      - name: Verify embedded Windows desktop icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe=(Resolve-Path 'dist/Sliqadius.exe').Path
          $icon=[System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw 'Windows konnte kein eingebettetes App-Icon aus Sliqadius.exe lesen.' }
          $bmp=$icon.ToBitmap()
          if ($bmp.Width -lt 16 -or $bmp.Height -lt 16) { throw 'Das eingebettete Windows-Icon ist ungültig.' }
          $bmp.Save((Join-Path $PWD 'dist/Sliqadius-embedded-icon.png'),[System.Drawing.Imaging.ImageFormat]::Png)
          Write-Host "EMBEDDED_ICON_OK $($bmp.Width)x$($bmp.Height)"
          $bmp.Dispose()
          $icon.Dispose()
          Get-FileHash dist/Sliqadius.exe -Algorithm SHA256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sliqadius-Windows
          path: dist/Sliqadius.exe
          if-no-files-found: error

      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag='windows-v1.2.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title 'Sliqadius Windows v1.2.0' --notes 'Windows build with the approved Sliqadius icon correctly embedded for Explorer, Desktop and taskbar.' --target $env:GITHUB_SHA
          }
          gh release upload $tag dist/Sliqadius.exe --clobber --repo $env:GITHUB_REPOSITORY

      - name: Update website Windows download
        shell: pwsh
        run: |
          git reset --hard HEAD
          git pull --rebase origin main
          $path='index.html'
          $html=Get-Content $path -Raw -Encoding UTF8
          $new='https://github.com/sliqadteam-beep/Sliqadius/releases/download/windows-v1.2.0/Sliqadius.exe'
          $html=[regex]::Replace($html,'https://github\.com/sliqadteam-beep/Sliqadius/releases/download/[^\"'']+/(Sliqadius-Setup|Sliqadius)\.exe',$new)
          Set-Content $path $html -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Update Windows download to icon-fixed build'
            git push origin main
          }
