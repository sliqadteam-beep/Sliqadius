name: Deploy Sliqadius Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Web v19 reliability fixes
        run: python ci_web_v18_patch.py

      - name: Validate Web JavaScript
        run: |
          node --check web-v15.js
          node --check web-bootstrap-v18.js
          node --check sliq-i18n-loader.js
          node --check sw.js
          for f in i18n/*.js; do node --check "$f"; done

      - name: Run Web smoke checks
        run: python web_smoke_check.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
