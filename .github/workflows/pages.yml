name: Deploy Sliqadius Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify website files
        run: |
          test -f index.html
          test -f city/index.html
          test -d city/v4
          test -f city/v4/part1.txt
          test -f city/v4/part2.txt
          test -f city/v4/part3.txt
          test -f city/v4/part4.txt
          test -f city/v4/part5.txt

      - name: Validate assembled City JavaScript
        run: |
          cat city/v4/part1.txt city/v4/part2.txt city/v4/part3.txt city/v4/part4.txt city/v4/part5.txt > /tmp/city.html
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/city.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/city.mjs').write_text(s[a:b])
          PY
          node --check /tmp/city.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
