name: Deploy SliqServer Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify SliqServer-only routing
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/404.html
          test -f site/CNAME
          test -f site/styles.css
          test -f site/server/index.html

          # Root and every missing/old route must go to the one canonical page.
          grep -q "url=/server/" site/index.html
          grep -q "location.replace('/server/')" site/index.html
          grep -q "url=/server/" site/404.html
          grep -q "location.replace('/server/')" site/404.html

          # The actual service exists only at /server/.
          grep -q "SliqServer" site/server/index.html
          grep -q "https://sliqado.org/server/" site/server/index.html
          grep -q "SliqServer-Windows.exe" site/server/index.html
          grep -q "SliqServer-Android.apk" site/server/index.html
          ! grep -qi "SliqGames" site/server/index.html
          ! grep -qi "Sliqadius" site/server/index.html
          ! grep -qi "Sliqado City" site/server/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload SliqServer website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
