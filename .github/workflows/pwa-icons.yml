name: Build PWA icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "logo-approved.jpg"
      - ".github/workflows/pwa-icons.yml"

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Create 192 and 512 PNG icons
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps

          src = Image.open("logo-approved.jpg").convert("RGB")
          for size in (192, 512):
              icon = ImageOps.fit(src, (size, size), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
              icon.save(f"pwa-icon-{size}.png", format="PNG", optimize=True)
          PY

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa-icon-192.png pwa-icon-512.png
          if git diff --cached --quiet; then
            echo "PWA icons are already current."
          else
            git commit -m "Update generated PWA icons"
            git push
          fi
