name: Repair City AutoBuild
on:
  push:
    paths:
      - '.github/workflows/repair-city-autobuild.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full city build
        shell: python
        run: |
          import base64,gzip,pathlib
          payload='[...truncated...]'
          pathlib.Path('city/index.html').write_bytes(gzip.decompress(base64.b64decode(payload)))
      - name: Commit repaired game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add city/index.html
          git commit -m 'Repair city game and add automatic zone construction' || exit 0
          git push
