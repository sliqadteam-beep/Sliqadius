<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101311">
<meta name="description" content="Sliqadius Web – KI-Assistent direkt im Browser.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Sliqadius Web</title>
<link rel="manifest" href="manifest.webmanifest?v=18">
<link rel="icon" type="image/png" href="logo.png?v=18">
<link rel="apple-touch-icon" href="logo.png?v=18">
<style>
:root{--bg:#101311;--bg2:#0c0f0d;--side:#0a0d0b;--panel:#171b18;--panel2:#1e241f;--panel3:#242b25;--user:#223028;--line:#29322b;--line2:#3a463d;--text:#f4f7f4;--muted:#919a92;--muted2:#667068;--green:#39d98a;--green2:#20b572;--greenSoft:rgba(57,217,138,.10);--danger:#ff7d86;--shadow:0 28px 90px rgba(0,0,0,.42);--max:940px}
body[data-theme="light"]{--bg:#f4f6f4;--bg2:#eef1ee;--side:#f8faf8;--panel:#fff;--panel2:#f0f3f0;--panel3:#e7ece8;--user:#e2f5e9;--line:#d7ded8;--line2:#c2ccc4;--text:#151915;--muted:#667068;--muted2:#8b948d;--green:#18b86c;--green2:#10985a;--greenSoft:rgba(24,184,108,.10);--shadow:0 24px 70px rgba(25,40,29,.12)}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}img{max-width:100%}.app{height:100dvh;display:grid;grid-template-columns:286px minmax(0,1fr);overflow:hidden;background:radial-gradient(circle at 72% -18%,rgba(57,217,138,.08),transparent 34%),var(--bg)}
.side{min-height:0;background:color-mix(in srgb,var(--side) 96%,transparent);border-right:1px solid var(--line);padding:14px 12px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;z-index:50}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:860;padding:7px 9px 10px;letter-spacing:-.4px}.brand img,.title img{object-fit:cover;display:block}.brand img{width:36px;height:36px;border-radius:11px;box-shadow:0 0 28px rgba(57,217,138,.18)}.title img{width:28px;height:28px;border-radius:8px}.new,.sbtn{width:100%;border:0;color:var(--text);border-radius:11px;padding:10px 11px;text-align:left;background:transparent;transition:.15s}.new{background:var(--panel);border:1px solid var(--line);font-weight:760}.new:hover,.sbtn:hover{background:var(--panel2)}.searchbox{position:relative}.searchbox:before{content:'⌕';position:absolute;left:11px;top:8px;color:var(--muted2);font-size:18px}.searchbox input{width:100%;height:39px;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--text);padding:0 10px 0 34px;outline:0;font-size:12px}.searchbox input:focus{background:var(--panel);border-color:var(--line2)}.hist{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px;scrollbar-gutter:stable}.chatrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-radius:10px;margin:1px 0}.chatrow.active,.chatrow:hover{background:var(--panel)}.chatrow.pinned .chat:before{content:'◆';font-size:7px;color:var(--green);margin-right:7px;vertical-align:2px}.chat{min-width:0;width:100%;border:0;background:transparent;color:color-mix(in srgb,var(--text) 72%,transparent);padding:10px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chatrow.active .chat{color:var(--text)}.chattools{display:flex;opacity:0;transition:.15s;padding-right:4px}.chatrow:hover .chattools,.chatrow.active .chattools{opacity:1}.iconbtn{border:0;background:transparent;color:var(--muted);width:27px;height:27px;border-radius:8px;padding:0;text-align:center}.iconbtn:hover,.iconbtn.active{background:var(--panel3);color:var(--text)}.iconbtn.active{color:var(--green)}.iconbtn.danger:hover{color:var(--danger)}.sidefoot{display:grid;gap:3px;border-top:1px solid var(--line);padding-top:8px}.languagebox{display:grid;gap:5px;padding:3px 8px}.languagebox label{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.12em}.languagebox select,.toplang{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;outline:0}.savehint{padding:5px 9px;color:var(--muted2);font-size:10px;display:flex;align-items:center;gap:6px}.savehint:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(57,217,138,.6)}
.main{min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}.top{height:calc(60px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;gap:8px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px);z-index:20}.hamb{display:none;border:0;background:transparent;color:var(--text);font-size:24px;padding:8px;margin-left:-8px}.title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:790}.topright{margin-left:auto;display:flex;align-items:center;gap:7px}.toplang{font-size:11px;max-width:135px}.apibadge,.usagebtn{border:1px solid var(--line2);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 10px;font-size:10px}.apibadge.ready{color:color-mix(in srgb,var(--green) 78%,var(--text));border-color:color-mix(in srgb,var(--green) 35%,var(--line));background:var(--greenSoft)}.usagebtn:hover,.apibadge:hover{color:var(--text);background:var(--panel2)}
.msgs{flex:1;min-height:0;overflow-y:auto!important;overflow-x:hidden;padding:30px clamp(16px,7vw,94px) 190px;scroll-behavior:smooth;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-gutter:stable}.empty{min-height:100%;display:grid;place-items:center;text-align:center}.emptyinner{max-width:760px}.emptylogo{width:56px;height:56px;border-radius:18px;margin:0 auto 17px;box-shadow:0 0 50px rgba(57,217,138,.14)}.empty h1{margin:0 0 9px;font-size:clamp(29px,5vw,40px);letter-spacing:-.04em}.empty p{margin:0;color:var(--muted);font-size:14px}.suggestions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}.suggestion{border:1px solid var(--line);background:var(--panel);color:color-mix(in srgb,var(--text) 75%,transparent);border-radius:999px;padding:9px 12px;font-size:12px}.suggestion:hover{border-color:var(--line2);color:var(--text);background:var(--panel2)}.row{width:100%;max-width:var(--max);margin:0 auto 17px;display:flex}.row.user{justify-content:flex-end}.msgwrap{max-width:min(820px,93%)}.bubble{padding:14px 17px;border-radius:20px;line-height:1.6;font-size:15px;overflow-wrap:anywhere;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.06)}.row.user .bubble{background:linear-gradient(145deg,var(--user),color-mix(in srgb,var(--user) 80%,var(--bg)));border-color:color-mix(in srgb,var(--green) 16%,var(--line))}.bubble.streaming{border-color:color-mix(in srgb,var(--green) 25%,var(--line))}.bubble img{display:block;max-width:min(480px,100%);max-height:370px;object-fit:contain;border-radius:14px;margin-bottom:10px}.textpart,.message-text{white-space:pre-wrap}.msgfiles{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 9px}.msgfile{display:inline-flex;align-items:center;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);border-radius:9px;padding:6px 8px;font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.msgtools{display:flex;gap:3px;margin-top:5px;opacity:0;transition:.15s;flex-wrap:wrap}.row:hover .msgtools{opacity:1}.msgtools button{border:0;background:transparent;color:var(--muted2);border-radius:8px;padding:5px 7px;font-size:10px}.msgtools button:hover,.msgtools button.active{background:var(--panel2);color:var(--text)}.msgtools button.active{color:var(--green)}.codeblock{margin:10px 0 4px;border:1px solid var(--line2);background:var(--bg2);border-radius:13px;overflow:hidden}.codehead{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--line);color:var(--muted);font-size:10px}.codehead button{border:0;background:transparent;color:var(--muted);font-size:10px}.codehead button:hover{color:var(--text)}.codeblock pre{margin:0;padding:13px;overflow:auto;color:var(--text);font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:18px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 28%);z-index:25;pointer-events:none}.bottom>*{pointer-events:auto}.filechips{display:none;width:min(var(--max),100%);margin:0 auto 8px;gap:6px;flex-wrap:wrap}.filechips.show{display:flex}.filechip{display:flex;align-items:center;gap:7px;max-width:min(290px,100%);height:42px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:5px 7px 5px 8px;box-shadow:var(--shadow);font-size:10px;color:var(--muted)}.filechip img{width:30px;height:30px;border-radius:8px;object-fit:cover}.filechip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.filechip button{margin-left:auto;border:0;background:transparent;color:var(--text);font-size:16px}.composer{width:min(var(--max),100%);margin:auto;background:color-mix(in srgb,var(--panel) 97%,transparent);border:1px solid var(--line2);border-radius:29px;display:flex;align-items:flex-end;gap:5px;padding:7px 8px;box-shadow:0 22px 60px rgba(0,0,0,.30),0 0 0 1px rgba(57,217,138,.02);position:relative}.composer:focus-within{border-color:color-mix(in srgb,var(--green) 35%,var(--line2));box-shadow:0 22px 60px rgba(0,0,0,.30),0 0 0 3px rgba(57,217,138,.05)}.roundbtn,.send{width:40px;height:40px;border-radius:50%;border:0;flex:none;display:grid;place-items:center}.roundbtn{background:var(--panel3);color:var(--text);font-size:19px}.roundbtn:hover{filter:brightness(1.08)}.roundbtn.listening{background:var(--green);color:#07110b;box-shadow:0 0 0 5px rgba(57,217,138,.10)}.send{background:var(--text);color:var(--bg);font-size:19px;font-weight:900}.send:hover{filter:brightness(1.08)}.send:disabled{background:var(--panel3);color:var(--muted2);cursor:default}.send.stop{background:var(--danger);color:white;font-size:12px}.input{flex:1;min-width:0;min-height:40px;max-height:154px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:10px 4px;line-height:20px}.input::placeholder{color:var(--muted)}.mode{position:relative;flex:none}.modebtn{height:40px;border:0;background:transparent;color:var(--muted);border-radius:11px;padding:0 7px;font-size:11px}.modebtn:hover{background:var(--panel3);color:var(--text)}.modes,.attachmenu{display:none;position:absolute;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:5px;box-shadow:var(--shadow)}.modes{right:0;bottom:48px;width:160px}.attachmenu{left:0;bottom:48px;width:190px}.modes.open,.attachmenu.open{display:block}.modes button,.attachmenu button{display:block;width:100%;border:0;background:transparent;color:var(--text);border-radius:9px;text-align:left;padding:10px;font-size:12px}.modes button:hover,.attachmenu button:hover{background:var(--panel3)}.note{text-align:center;color:var(--muted2);font-size:10px;margin-top:7px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.52);opacity:0;visibility:hidden;pointer-events:none;z-index:80;transition:.2s}.shade.open{opacity:1;visibility:visible;pointer-events:auto}.modalshade{position:fixed;inset:0;background:rgba(0,0,0,.70);opacity:0;visibility:hidden;pointer-events:none;z-index:120;display:flex;align-items:center;justify-content:center;padding:18px;transition:.15s}.modalshade.open{opacity:1;visibility:visible;pointer-events:auto}.modal{width:min(540px,100%);max-height:min(760px,88dvh);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:21px;padding:24px;box-shadow:0 35px 100px rgba(0,0,0,.55)}.modal.wide{width:min(620px,100%)}.modal h2{margin:0 0 8px;font-size:23px;letter-spacing:-.02em}.modal p{font-size:12px;color:var(--muted);line-height:1.55}.key,.renameinput,.editinput,.memoryinput{width:100%;border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:13px;padding:12px 14px;outline:0;margin:9px 0}.key:focus,.renameinput:focus,.editinput:focus,.memoryinput:focus{border-color:color-mix(in srgb,var(--green) 45%,var(--line2));box-shadow:0 0 0 3px var(--greenSoft)}.editinput,.memoryinput{resize:vertical;min-height:120px}.small{font-size:10px!important;color:var(--muted2)!important}.status{min-height:18px;font-size:11px;color:var(--danger);margin-top:5px}.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button,.actions a{border:1px solid var(--line2);border-radius:10px;padding:9px 14px;background:var(--panel2);color:var(--text);text-decoration:none}.actions button:hover,.actions a:hover{filter:brightness(1.07)}.actions .primary{background:var(--text);color:var(--bg);border-color:var(--text)}.actions .green{background:var(--green);border-color:var(--green);color:#07110b;font-weight:800}.memorylist{display:grid;gap:8px;margin-top:14px}.memoryrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 11px;color:color-mix(in srgb,var(--text) 84%,transparent);font-size:12px;line-height:1.45}.memoryrow button{border:0;background:transparent;color:var(--muted);font-size:17px}.emptylist{padding:18px 4px;color:var(--muted);font-size:12px}.segments{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}.segments button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:11px;padding:11px}.segments button.active{background:var(--greenSoft);border-color:color-mix(in srgb,var(--green) 35%,var(--line));color:var(--text)}.usagegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}.stat{border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:12px}.stat span{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.stat strong{display:block;font-size:15px;overflow-wrap:anywhere}.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,15px);opacity:0;pointer-events:none;z-index:300;background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:999px;padding:9px 13px;font-size:11px;box-shadow:var(--shadow);transition:.18s;max-width:min(560px,calc(100% - 26px));text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.app{display:block}.side{position:fixed;inset:0 auto 0 0;width:min(86vw,315px);transform:translateX(-105%);transition:.2s;box-shadow:20px 0 70px rgba(0,0,0,.5);z-index:90}.side.open{transform:none}.hamb{display:block}.msgs{padding:20px 12px 184px}.bubble{font-size:14px}.toplang{max-width:100px}.apibadge{display:none}.msgwrap{max-width:95%}.msgtools{opacity:1}.suggestions{justify-content:flex-start}.empty{text-align:left}.emptylogo{margin-left:0}.empty h1{font-size:31px}.usagegrid{grid-template-columns:1fr}.usagebtn{padding:6px 8px}.composer{gap:3px}.modebtn{font-size:10px}}
@media(max-width:430px){.roundbtn,.send{width:36px;height:36px}.modebtn{height:36px}.composer{padding:6px}.input{font-size:14px;padding-inline:2px}.title img{display:none}.toplang{max-width:88px}.usagebtn{font-size:0}.usagebtn:first-letter{font-size:13px}.modal{padding:19px;border-radius:18px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><img src="logo-approved.jpg" alt="Sliqadius"><span>Sliqadius Web</span></div>
    <button class="new" id="newChatBtn" type="button">＋ Neuer Chat</button>
    <div class="searchbox"><input id="chatSearch" type="search" autocomplete="off" placeholder="Chats durchsuchen"></div>
    <div class="hist" id="history"></div>
    <div class="sidefoot">
      <button class="sbtn" id="memoryBtn" type="button">◫ Memory</button>
      <button class="sbtn" id="themeBtn" type="button">◐ Darstellung</button>
      <button class="sbtn" id="changeKeyBtn" type="button">◇ API-Key ändern</button>
      <button class="sbtn" id="exportBtn" type="button">⇩ Daten sichern</button>
      <button class="sbtn" id="importBtn" type="button">⇧ Sicherung laden</button>
      <button class="sbtn" id="installAppBtn" type="button">⊕ App installieren</button>
      <div class="languagebox"><label id="langLabel" for="langSide">Sprache</label><select id="langSide"></select></div>
      <a class="sbtn" id="installLink" href="install.html">Installationsanleitung</a>
      <a class="sbtn" id="backLink" href="index.html">← Zur Website</a>
      <div class="savehint" id="saveHint">Automatisch gespeichert</div>
    </div>
  </aside>
  <div class="shade" id="shade"></div>
  <main class="main" id="mainArea">
    <header class="top">
      <button class="hamb" id="menuBtn" type="button" aria-label="Menü">☰</button>
      <span class="title"><img src="logo-approved.jpg" alt="">Sliqadius</span>
      <div class="topright">
        <button class="usagebtn" id="usageBtn" type="button">◌ Nutzung</button>
        <select class="toplang" id="langTop" aria-label="Sprache"></select>
        <button class="apibadge" id="apiBadge" type="button">API fehlt</button>
      </div>
    </header>
    <section class="msgs" id="messages"></section>
    <div class="bottom">
      <div class="filechips" id="attachmentChips"></div>
      <div class="composer">
        <div class="mode">
          <button class="roundbtn" id="attachBtn" type="button" aria-label="Anhängen">＋</button>
          <div class="attachmenu" id="attachMenu"><button id="attachImageBtn" type="button">▧ Bild hinzufügen</button><button id="attachFileBtn" type="button">⌘ Datei hinzufügen</button></div>
        </div>
        <textarea class="input" id="messageInput" rows="1" placeholder="Nachricht an Sliqadius"></textarea>
        <div class="mode"><button class="modebtn" id="modeBtn" type="button">Mittel⌄</button><div class="modes" id="modeMenu"><button type="button" data-mode="fast">Schnell</button><button type="button" data-mode="medium">Mittel</button><button type="button" data-mode="smart">Schlau</button></div></div>
        <button class="roundbtn" id="micBtn" type="button" hidden aria-hidden="true" tabindex="-1"></button>
        <button class="send" id="sendBtn" type="button" disabled aria-label="Senden">↑</button>
      </div>
      <div class="note" id="note">Enter = senden · Shift + Enter = neue Zeile</div>
    </div>
  </main>
</div>

<input id="fileInput" type="file" multiple hidden>
<input id="importInput" type="file" accept="application/json,.json" hidden>

<div class="modalshade" id="keyModal"><div class="modal"><h2 id="keyTitle">Groq API Key</h2><p id="keyText"></p><input id="keyInput" class="key" type="password" placeholder="gsk_..." autocomplete="off"><p class="small" id="keyHint"></p><div class="status" id="keyStatus"></div><div class="actions"><button id="cancelKeyBtn" type="button">Abbrechen</button><a class="green" id="getKeyLink" href="https://console.groq.com/keys" target="_blank" rel="noopener noreferrer">API-Key holen</a><button class="primary" id="saveKeyBtn" type="button">Speichern</button></div></div></div>
<div class="modalshade" id="renameModal"><div class="modal"><h2 id="renameTitle">Chat umbenennen</h2><input id="renameInput" class="renameinput" maxlength="80"><div class="actions"><button id="renameCancel" type="button">Abbrechen</button><button id="renameSave" class="primary" type="button">Speichern</button></div></div></div>
<div class="modalshade" id="editModal"><div class="modal"><h2 id="editTitle">Nachricht bearbeiten</h2><textarea id="editInput" class="editinput"></textarea><div class="actions"><button id="editCancel" type="button">Abbrechen</button><button id="editSave" class="primary" type="button">Speichern & neu generieren</button></div></div></div>
<div class="modalshade" id="memoryModal"><div class="modal wide"><h2 id="memoryTitle">Sliqadius Memory</h2><p id="memoryHint"></p><textarea id="memoryInput" class="memoryinput"></textarea><div class="actions"><button id="memoryClose" type="button">Abbrechen</button><button id="memoryAdd" class="green" type="button">Memory hinzufügen</button></div><div class="memorylist" id="memoryList"></div></div></div>
<div class="modalshade" id="appearanceModal"><div class="modal"><h2 id="appearanceTitle">Darstellung</h2><div class="segments"><button type="button" data-theme-choice="system">System</button><button type="button" data-theme-choice="dark">Dunkel</button><button type="button" data-theme-choice="light">Hell</button></div><div class="actions"><button id="appearanceClose" type="button">Abbrechen</button></div></div></div>
<div class="modalshade" id="usageModal"><div class="modal wide"><h2 id="usageTitle">API-Nutzung</h2><div class="usagegrid" id="usageGrid"></div><p class="small" id="usageNote"></p><div class="actions"><button id="usageClear" type="button">Statistik löschen</button><button id="usageClose" class="primary" type="button">Schließen</button></div></div></div>
<div class="toast" id="toast"></div>

<script src="sliq-i18n-loader.js?v=18"></script>
<script src="web-bootstrap-v18.js?v=18"></script>
<script src="web-v15.js?v=18"></script>
</body>
</html>
