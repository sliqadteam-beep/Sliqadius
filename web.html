<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><img class="brandlogo" src="logo-approved.jpg" alt="Sliqadius Logo"><span>Sliqadius Web</span></div>
    <button class="new" id="new" type="button">＋ Neuer Chat</button>
    <div class="hist" id="hist"></div>
    <div class="sidebottom">
      <div class="languagebox"><label id="langLabel" for="langSide">Sprache</label><select id="langSide"></select></div>
      <button class="sbtn" id="changeKey" type="button">API-Key ändern</button>
      <a class="sbtn" id="installLink" href="install.html">Installationsanleitung</a>
      <a class="sbtn" id="backSite" href="index.html">← Zur Website</a>
    </div>
  </aside>
  <div class="shade" id="shade"></div>
  <main class="main">
    <header class="top">
      <button class="hamb" id="hamb" type="button" aria-label="Menü">☰</button>
      <span class="title"><img class="toplogo" src="logo-approved.jpg" alt="">Sliqadius</span>
      <div class="topright">
        <select class="toplang" id="langTop" aria-label="Sprache"></select>
        <button class="apiok" id="apiBadge" type="button">API fehlt</button>
      </div>
    </header>
    <section class="msgs" id="msgs"></section>
    <div class="bottom">
      <div class="chip" id="chip"><img id="chipImg" alt=""><span id="chipText"></span><button id="remove" type="button" aria-label="Bild entfernen">×</button></div>
      <form class="composer" id="composerForm">
        <button class="plus" id="plus" type="button" aria-label="Bild hinzufügen">+</button>
        <textarea class="input" id="input" rows="1" placeholder="Nachricht an Sliqadius"></textarea>
        <div class="mode" id="mode">
          <button class="modebtn" id="modeBtn" type="button">Mittel⌄</button>
          <div class="modes">
            <button data-m="fast" type="button">Schnell</button>
            <button data-m="medium" type="button">Mittel</button>
            <button data-m="smart" type="button">Schlau</button>
          </div>
        </div>
        <button class="send" id="send" type="submit" disabled aria-label="Senden">↑</button>
      </form>
      <div class="note" id="note">Enter = senden · Shift + Enter = neue Zeile</div>
    </div>
  </main>
</div>
<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<div class="modalshade" id="keyModal" role="dialog" aria-modal="true" aria-labelledby="keyTitle">
  <div class="modal">
    <h2 id="keyTitle">Groq API Key</h2>
    <p id="keyText">Sliqadius braucht deinen eigenen Groq API-Key, um Nachrichten zu senden.</p>
    <input id="keyInput" class="key" type="password" placeholder="gsk_..." autocomplete="off">
    <p class="small" id="keyHint"></p>
    <div class="statusline" id="keyStatus"></div>
    <div class="actions">
      <button id="cancelKey" type="button">Abbrechen</button>
      <a class="green" id="getKey" href="https://console.groq.com/keys" target="_blank" rel="noopener noreferrer">API-Key holen</a>
      <button class="primary" id="saveKey" type="button">Speichern</button>
    </div>
  </div>
</div>

  $('installLink').textContent=ui.install;$('backSite').textContent=ui.back;$('note').textContent=ui.note;$('cancelKey').textContent=ui.cancel;
  $('saveKey').textContent=ui.save;$('getKey').textContent=ui.getKey;$('keyText').textContent=ui.keyText;$('keyHint').textContent=ui.keyHint;
  document.querySelector('[data-m="fast"]').textContent=ui.f;document.querySelector('[data-m="medium"]').textContent=ui.m;document.querySelector('[data-m="smart"]').textContent=ui.s
}
function renderHistory(){
  const h=$('hist');h.innerHTML='';
  for(const c of chats){const b=document.createElement('button');b.type='button';b.className='chat'+(c.id===current?' on':'');b.textContent=c.title||'Chat';b.onclick=()=>{current=c.id;renderHistory();render();closeSide()};h.appendChild(b)}
}
function render(){
  const box=$('msgs'),c=cur();box.innerHTML='';
  if(!c||(!c.messages.length&&!busy)){box.innerHTML=`<div class="empty"><div><h1>${escapeHtml(ui.e)}</h1><p>${escapeHtml(ui.h)}</p></div></div>`;return}
  for(const x of c.messages){const r=document.createElement('div');r.className='row '+(x.role==='user'?'u':'a');const b=document.createElement('div');b.className='bubble';if(x.image){const im=document.createElement('img');im.src=x.image;im.alt='';b.appendChild(im)}const d=document.createElement('div');d.textContent=x.content||'';b.appendChild(d);r.appendChild(b);box.appendChild(r)}
  if(busy){const r=document.createElement('div');r.className='row a';const b=document.createElement('div');b.className='bubble think';b.textContent=ui.t+'…';r.appendChild(b);box.appendChild(r)}
  requestAnimationFrame(()=>box.scrollTop=box.scrollHeight)
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateSend(){const ok=!busy&&Boolean($('input').value.trim()||pending);$('send').disabled=!ok;return ok}
function newChat(){const c={id:uuid(),title:ui.n.replace('＋ ',''),messages:[]};chats.unshift(c);current=c.id;persist();renderHistory();render();closeSide();$('input').focus()}
function openSide(){$('side').classList.add('on');$('shade').classList.add('on')}
function closeSide(){$('side').classList.remove('on');$('shade').classList.remove('on')}
function modeText(){return mode==='fast'?ui.f:mode==='smart'?ui.s:ui.m}
function refreshMode(){$('modeBtn').textContent=modeText()+'⌄'}

function showKey(required=false,retry=false){
  retryAfterKey=retry;
  $('keyStatus').textContent=required?ui.keyRequired:'';
  $('keyStatus').className='statusline'+(required?' bad':'');
  $('keyModal').classList.add('on');
  $('keyInput').value=key();
  setTimeout(()=>$('keyInput').focus(),50)
}
function hideKey(){$('keyModal').classList.remove('on');retryAfterKey=false}
function saveKeyFromModal(){
  const v=$('keyInput').value.trim();
  if(!v.startsWith('gsk_')||v.length<20){$('keyStatus').textContent=ui.invalid;$('keyStatus').className='statusline bad';return}
  savePersistentKey(v);updateApiBadge();
  const retry=retryAfterKey;$('keyModal').classList.remove('on');retryAfterKey=false;$('input').focus();
  if(retry)setTimeout(()=>$('composerForm').requestSubmit(),0)
}

async function makeImageData(file){
  if(!file||!file.type.startsWith('image/'))throw Error('BAD_IMAGE');
  if(file.size>20*1024*1024)throw Error('BAD_IMAGE');
  const src=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});
  const im=await new Promise((ok,no)=>{const x=new Image();x.onload=()=>ok(x);x.onerror=no;x.src=src});
  const render=(maxPx,quality)=>{let w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;const scale=Math.min(1,maxPx/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);return c.toDataURL('image/jpeg',quality)};
  return{api:render(1600,.82),thumb:render(520,.68)}
}
function sys(){
  const mi=mode==='fast'?'Prioritize speed and concise useful answers.':mode==='smart'?'Prioritize correctness. Silently verify assumptions, calculations, edge cases and contradictions before answering.':'Balance speed and correctness. Silently verify important claims.';
  return `You are Sliqadius, a capable general assistant. Preferred language: ${LANG_NAMES[lang]||lang}. Reply in that language by default unless the user clearly requests another language. ${mi} Follow the conversation context. Do not invent facts. For coding, provide complete runnable code when practical. Never reveal private chain-of-thought; provide only useful conclusions and concise explanations.`
}
async function requestGroq(body){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),70000);
  try{return await fetch(API,{method:'POST',headers:{Authorization:'Bearer '+key(),'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal})}
  finally{clearTimeout(timer)}
}
async function groq(messages,img){
  if(!key())throw Error('NO_KEY');
  const recent=messages.slice(-24);let body;
  if(img){
    const prior=recent.slice(0,-1).map(x=>({role:x.role,content:x.content}));
    const q=recent.at(-1)?.content||ui.q;
    body={model:VISION,messages:[...prior,{role:'user',content:[{type:'text',text:`${sys()}\n\nAnalyze the attached image carefully. Read visible text, numbers, UI elements and error messages when relevant. User question: ${q}`},{type:'image_url',image_url:{url:img}}]}],temperature:.6,top_p:.95,max_completion_tokens:mode==='smart'?1600:mode==='medium'?1100:750,reasoning_effort:mode==='fast'?'none':'default',reasoning_format:'hidden',stream:false}
  }else{
    const msgs=[{role:'system',content:sys()},...recent.map(x=>({role:x.role,content:x.content}))];
    body={model:mode==='fast'?M20:M120,messages:msgs,temperature:.5,top_p:.95,max_completion_tokens:mode==='fast'?1800:mode==='smart'?4200:3000,reasoning_effort:mode==='fast'?'low':mode==='smart'?'high':'medium',include_reasoning:false,stream:false}
  }
  let r=await requestGroq(body);
  if(r.status===429){
    const txt=await r.text(),m=txt.match(/try again in\s+([0-9.]+)(ms|s)/i);
    if(m&&!/tokens per day|requests per day|\bTPD\b|\bRPD\b/i.test(txt)){const ms=parseFloat(m[1])*(m[2].toLowerCase()==='ms'?1:1000);await new Promise(ok=>setTimeout(ok,Math.min(8000,Math.max(800,ms+350))));r=await requestGroq(body)}
    else throw Error('HTTP 429 '+txt.slice(0,600))
  }
  if(!r.ok){const txt=await r.text();throw Error('HTTP '+r.status+' '+txt.slice(0,900))}
  const j=await r.json(),out=j?.choices?.[0]?.message?.content;
  return typeof out==='string'&&out.trim()?out.trim():ui.bad
}
function friendly(e){
  const s=String(e?.message||e).toLowerCase();console.error(e);
  if(s.includes('no_key'))return ui.keyText;if(s.includes('401')||s.includes('invalid api'))return '🔑 '+ui.invalid;if(s.includes('429'))return '⏳ '+ui.limit;
  if(s.includes('bad_image'))return '🖼️ '+ui.tooBig;if(s.includes('failed to fetch')||s.includes('network')||s.includes('abort')||s.includes('cors'))return '📡 '+ui.network;
  if(s.includes('400'))return '⚠️ '+ui.bad+' (Groq 400)';return '⚠️ '+ui.bad
}
async function send(){
  if(!updateSend())return;
  if(!key()){showKey(true,true);return}
  const text=$('input').value.trim(),img=pending?.api||null,thumb=pending?.thumb||null,shown=text||ui.q,c=cur();
  const u={role:'user',content:shown,image:thumb},next={...c,title:c.messages.length?c.title:(shown.length>32?shown.slice(0,32)+'…':shown),messages:[...c.messages,u]};
  replace(next);$('input').value='';$('input').style.height='auto';pending=null;$('chip').classList.remove('on');$('chipImg').src='';busy=true;updateSend();render();
  try{const a=await groq(next.messages,img);replace({...cur(),messages:[...cur().messages,{role:'assistant',content:a}]})}
  catch(e){replace({...cur(),messages:[...cur().messages,{role:'assistant',content:friendly(e)}]})}
  finally{busy=false;updateSend();render();$('input').focus()}
}

$('new').addEventListener('click',newChat);
$('hamb').addEventListener('click',openSide);
$('shade').addEventListener('click',closeSide);
$('changeKey').addEventListener('click',()=>showKey(false,false));
$('apiBadge').addEventListener('click',()=>showKey(false,false));
$('cancelKey').addEventListener('click',hideKey);
$('saveKey').addEventListener('click',saveKeyFromModal);
$('keyInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveKeyFromModal()}});
$('langSide').addEventListener('change',e=>setLanguage(e.target.value));
$('langTop').addEventListener('change',e=>setLanguage(e.target.value));
$('plus').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{pending=await makeImageData(f);$('chipImg').src=pending.thumb;$('chipText').textContent='🖼️ '+ui.i+': '+f.name;$('chip').classList.add('on');updateSend()}catch{alert(ui.tooBig)}finally{e.target.value=''}});
$('remove').addEventListener('click',()=>{pending=null;$('chip').classList.remove('on');$('chipImg').src='';updateSend()});
$('composerForm').addEventListener('submit',e=>{e.preventDefault();send()});
$('input').addEventListener('input',()=>{updateSend();$('input').style.height='auto';$('input').style.height=Math.min(150,$('input').scrollHeight)+'px'});
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('composerForm').requestSubmit()}});
$('modeBtn').addEventListener('click',e=>{e.stopPropagation();$('mode').classList.toggle('on')});
document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.m;localStorage.setItem('sliq-web-mode',mode);$('mode').classList.remove('on');refreshMode();$('input').focus()}));
document.addEventListener('click',e=>{if(!$('mode').contains(e.target))$('mode').classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('mode').classList.remove('on');closeSide();if($('keyModal').classList.contains('on'))hideKey()}});

fillLanguages();applyLanguage();refreshMode();renderHistory();render();updateSend();updateApiBadge();persist();$('input').focus();
</script>
