<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Redirecting…</title>
  <script>
    (function () {
      const path = window.location.pathname;
      if (/^\/Qevyno(?:\/|$)/i.test(path)) {
        if (!/^\/Qevyno\/index\.html$/i.test(path)) {
          window.location.replace('/Qevyno/index.html?v=21');
        }
        return;
      }
      window.location.replace('/server/');
    })();
  </script>
</head>
<body>
  <p>If you are looking for Qevyno, <a href="/Qevyno/index.html?v=21">open Qevyno here</a>.</p>
  <p>Otherwise, <a href="/server/">open SliqServer</a>.</p>
</body>
</html>
