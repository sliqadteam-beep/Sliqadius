<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#20c6c9">
<title>Open Qevyno</title>
<style>
:root{--bg:#f7fafc;--card:#fff;--text:#17212b;--muted:#6f7f88;--accent:#20c6c9;--line:#dce5e9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 18px 55px rgba(23,33,43,.08);text-align:center}.mark{width:72px;height:72px;border-radius:22px;margin:0 auto 18px;background:var(--accent);color:white;display:grid;place-items:center;font-size:34px;font-weight:800}.title{font-size:27px;font-weight:760;letter-spacing:-.7px}.sub{margin:8px auto 24px;color:var(--muted);font-size:14px;line-height:1.5;max-width:320px}.btn{width:100%;height:52px;border:0;border-radius:14px;background:var(--accent);color:white;font-size:15px;font-weight:700;cursor:pointer}.link{display:inline-block;margin-top:16px;color:#55727a;text-decoration:none;font-size:13px}.bad{display:none;color:#c84855;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<main class="card">
  <div class="mark">Q</div>
  <div class="title">Qevyno contact</div>
  <div class="sub">Open Qevyno to start a chat with the person who shared this QR code.</div>
  <button class="btn" id="openBtn">Open in Qevyno</button>
  <div class="bad" id="bad">This QR link is invalid.</div>
  <a class="link" href="../Qevyno.apk">Download Qevyno</a>
</main>
<script>
const p=new URLSearchParams(location.search);const phone=p.get('phone')||'';const ok=/^\+[1-9]\d{7,14}$/.test(phone);const btn=document.getElementById('openBtn');if(!ok){btn.disabled=true;btn.style.opacity='.45';document.getElementById('bad').style.display='block'}else{btn.onclick=()=>{location.href='qevyno://add?phone='+encodeURIComponent(phone)}}
</script>
</body>
</html>
