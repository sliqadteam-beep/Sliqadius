<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8ABFF4">
<title>Open Skaysa</title>
<style>
:root{--bg:#f5f8fc;--card:#fff;--text:#17212b;--muted:#73838e;--accent:#8ABFF4;--line:#dce6ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 18px 55px rgba(23,33,43,.08);text-align:center}.mark{width:76px;height:76px;border-radius:24px;margin:0 auto 18px;background:linear-gradient(145deg,#a8d6ff,#6fa8ee);position:relative}.mark:before,.mark:after{content:"";position:absolute;border:5px solid #fff;border-radius:999px;transform:rotate(-22deg)}.mark:before{width:39px;height:18px;left:13px;top:13px;border-left-color:transparent;border-bottom-color:transparent}.mark:after{width:39px;height:18px;left:13px;bottom:13px;border-right-color:transparent;border-top-color:transparent}.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff}.d1{left:15px;bottom:15px}.d2{left:33px;top:33px}.d3{right:15px;top:15px}.title{font-size:27px;font-weight:850;letter-spacing:-.7px}.sub{margin:8px auto 24px;color:var(--muted);font-size:14px;line-height:1.5;max-width:320px}.btn{width:100%;height:52px;border:0;border-radius:14px;background:var(--accent);color:#102335;font-size:15px;font-weight:800;cursor:pointer}.link{display:inline-block;margin-top:16px;color:#55727a;text-decoration:none;font-size:13px}.bad{display:none;color:#c84855;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<main class="card">
  <div class="mark"><i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i></div>
  <div class="title">Skaysa contact</div>
  <div class="sub">Open Skaysa to start a chat with the person who shared this QR code.</div>
  <button class="btn" id="openBtn">Open in Skaysa</button>
  <div class="bad" id="bad">This QR link is invalid.</div>
  <a class="link" href="../Qevyno.apk">Download Skaysa</a>
</main>
<script>
const p=new URLSearchParams(location.search);const phone=p.get('phone')||'';const ok=/^\+[1-9]\d{7,14}$/.test(phone);const btn=document.getElementById('openBtn');if(!ok){btn.disabled=true;btn.style.opacity='.45';document.getElementById('bad').style.display='block'}else{btn.onclick=()=>{location.href='qevyno://add?phone='+encodeURIComponent(phone)}}
</script>
</body>
</html>
